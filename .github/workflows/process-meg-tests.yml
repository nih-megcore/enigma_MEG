name: process_meg tests

on:
  push:
    paths:
      - ".github/workflows/process-meg-tests.yml"
      - "enigmeg/process_meg.py"
      - "enigmeg/tests/**"
      - "pyproject.toml"
      - "pytest.ini"
  pull_request:
    paths:
      - ".github/workflows/process-meg-tests.yml"
      - "enigmeg/process_meg.py"
      - "enigmeg/tests/**"
      - "pyproject.toml"
      - "pytest.ini"
  workflow_dispatch:

jobs:
  test-process-meg:
    name: pytest
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            "numpy<2" \
            "scipy<1.13" \
            "pandas<2.3" \
            "mne==1.5.*" \
            "mne-bids==0.13.*" \
            "fooof==1.1.*" \
            "PySimpleGUI-4-foss" \
            "munch" \
            "matplotlib" \
            "pillow" \
            "nibabel" \
            "statsmodels" \
            "seaborn" \
            "h5io" \
            "pytest" \
            "pytest-cov"
          python -m pip install --no-deps -e .

      - name: Run process_meg tests
        run: pytest -q enigmeg/tests
